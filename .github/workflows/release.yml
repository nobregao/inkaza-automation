name: Release INKAZA

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Sistemas para os quais gerar executáveis"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
      prerelease:
        description: "Marcar como pré-release para teste do cliente"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate next version
        id: version
        run: python scripts/calculate_release_version.py

      - name: Select build matrix
        id: matrix
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            all)
              value='{"include":[{"runner":"windows-latest","platform":"windows","arch":"x64"},{"runner":"macos-15-intel","platform":"macos","arch":"x64"},{"runner":"macos-15","platform":"macos","arch":"arm64"}]}'
              ;;
            windows)
              value='{"include":[{"runner":"windows-latest","platform":"windows","arch":"x64"}]}'
              ;;
            macos)
              value='{"include":[{"runner":"macos-15-intel","platform":"macos","arch":"x64"},{"runner":"macos-15","platform":"macos","arch":"arm64"}]}'
              ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Inject release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          Path("version.py").write_text(
              f'__version__ = "{version}"\n',
              encoding="utf-8",
          )
          PY

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name INKAZA \
            --icon assets/icon.png \
            --collect-all ttkbootstrap \
            launcher.pyw

      - name: Build macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name INKAZA \
            --icon assets/icon.png \
            --osx-bundle-identifier br.com.inkaza.automation \
            --collect-all ttkbootstrap \
            launcher.pyw
          codesign --force --deep --sign - dist/INKAZA.app

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "INKAZA-v${{ needs.prepare.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path "dist\INKAZA" -DestinationPath $name -Force

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="INKAZA-v${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/INKAZA.app "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: INKAZA-${{ matrix.platform }}-${{ matrix.arch }}
          path: INKAZA-v${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          prerelease_flag=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/*.zip \
              --target "${{ github.sha }}" \
              --title "INKAZA v$RELEASE_VERSION" \
              --generate-notes \
              $prerelease_flag
          fi
